name: hq-team-smoke
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: team helper end-to-end
        env:
          HQTEAM_NAME: team-smoke
        run: |
          curl -fsSL --max-time 15 https://raw.githubusercontent.com/mohammadlali0707-stack/agw-workers/main/tools/hqteam.py -o /tmp/hqteam.py
          python3 /tmp/hqteam.py read "" 3
          python3 /tmp/hqteam.py post status "اتصال کارگر به تابلوی تیم برقرار شد (تست کوتاه)." team
          printf 'def add(a,b):\n    return a-b\n' > /tmp/work.py
          python3 /tmp/hqteam.py review "Function add(a,b) must return the sum of a and b." --file /tmp/work.py --topic team --wait 400
